name: Build & Test Flow OS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test & build Flow Launcher
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest :app:assembleRelease

      - name: Build Jingle Flow
        working-directory: jingle
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Prepare APK artifacts
        run: |
          mkdir -p dist
          cp launcher/app/build/outputs/apk/release/app-release.apk dist/FlowLauncher.apk
          cp jingle/app/build/outputs/apk/release/app-release.apk dist/JingleFlow.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flow-os-apks
          path: dist/*.apk

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
